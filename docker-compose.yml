services:
  transub:
    build: .
    image: urisuzy/transub:latest
    container_name: transub
    restart: always
    env_file: .env
    environment:
      TRANSLATION_CACHE_ENABLED: "${TRANSLATION_CACHE_ENABLED:-1}"
      TRANSLATION_CACHE_PATH: "${TRANSLATION_CACHE_PATH:-/data/translations.sqlite3}"
      TRANSLATION_CACHE_VERSION: "${TRANSLATION_CACHE_VERSION:-1}"
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - transub-cache:/data
    networks:
      - transub-net
    # FastAPI. Endpoint: POST http://localhost:${PORT}/translate
    # body: {"srt_text_base64": "..."} -> {"translated_srt_base64": "..."}
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000

# Shared network agar transub-api bisa memanggil service ini via nama "transub".
# Buat sekali di VPS:  docker network create transub-net
networks:
  transub-net:
    external: true

volumes:
  transub-cache:
